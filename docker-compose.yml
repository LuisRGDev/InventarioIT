services:

  # ==========================================================
  # Laravel / PHP-FPM
  # ==========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: inventarioit_app

    restart: unless-stopped

    working_dir: /var/www

    volumes:
      - ./:/var/www

    networks:
      - inventarioit_net

    depends_on:
      db:
        condition: service_healthy

  # ==========================================================
  # Nginx
  # ==========================================================
  nginx:
    image: nginx:stable-alpine

    container_name: inventarioit_nginx

    restart: unless-stopped

    ports:
      - "8001:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - inventarioit_net

    depends_on:
      - app

  # ==========================================================
  # MariaDB
  # ==========================================================
  db:
    image: mariadb:11

    container_name: inventarioit_db

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: itam_db
      MYSQL_USER: userIt
      MYSQL_PASSWORD: Middleby
      MYSQL_ROOT_PASSWORD: root_password

    ports:
      - "3316:3306"

    volumes:
      - inventarioit_db_data:/var/lib/mysql

    networks:
      - inventarioit_net

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


# ============================================================
# Red
# ============================================================
networks:
  inventarioit_net:
    driver: bridge


# ============================================================
# Volúmenes persistentes
# ============================================================
volumes:
  inventarioit_db_data: